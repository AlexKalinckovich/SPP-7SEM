openapi: 3.0.3
info:
  title: Auction API
  description: >
    REST API для лабораторной работы «Аукцион». Сервер — NodeJS (Express),
    клиент — SPA. Обмен данными в формате JSON.
  version: 1.0.0
  contact:
    name: SPP-7SEM
servers:
  - url: http://localhost:3000/api
    description: Локальный dev-сервер

tags:
  - name: AuctionSlots
    description: Работа со слотами аукциона

paths:
  /health:
    get:
      tags:
        - System
      summary: Проверка работоспособности сервера
      operationId: healthCheck
      responses:
        '200':
          description: Сервер работает
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    description: Время работы сервера в секундах
                    example: 42.5

  /slots:
    get:
      tags:
        - AuctionSlots
      summary: Получить список всех слотов аукциона
      operationId: getSlots
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AuctionSlotStatus'
          description: Фильтр по статусу слота
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Максимальное количество записей
          required: false
      responses:
        '200':
          description: Список слотов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuctionSlot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - AuctionSlots
      summary: Создать новый слот аукциона
      operationId: postSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionSlotCreate'
      responses:
        '201':
          description: Слот создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionSlot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /slots/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
        description: Идентификатор слота
    get:
      tags:
        - AuctionSlots
      summary: Получить слот аукциона по идентификатору
      operationId: getSlot
      responses:
        '200':
          description: Слот найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionSlot'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - AuctionSlots
      summary: Полностью обновить слот аукциона
      operationId: putSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionSlotUpdate'
      responses:
        '200':
          description: Слот обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionSlot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - AuctionSlots
      summary: Удалить слот аукциона
      operationId: deleteSlot
      responses:
        '204':
          description: Слот удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    AuctionSlotStatus:
      type: string
      enum:
        - draft
        - active
        - closed
        - sold
        - cancelled
      description: Жизненный цикл слота аукциона

    AuctionSlot:
      type: object
      required:
        - id
        - title
        - startPrice
        - status
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор
          example: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: 'Картина «Рассвет»'
        description:
          type: string
          maxLength: 4000
          example: 'Масло, холст, 50x70 см, автор: И. Петров'
        startPrice:
          type: number
          format: double
          minimum: 0
          example: 1000.0
        currentBid:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Текущая максимальная ставка. null, если ставок ещё не было
          example: 2500.0
        seller:
          type: string
          example: 'ivanov'
          description: Имя продавца
        status:
          $ref: '#/components/schemas/AuctionSlotStatus'
        startsAt:
          type: string
          format: date-time
          nullable: true
          description: Момент старта торгов
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: Момент окончания торгов
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Время последнего изменения

    AuctionSlotCreate:
      type: object
      description: Данные для создания слота
      required:
        - title
        - startPrice
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        startPrice:
          type: number
          format: double
          minimum: 0
        seller:
          type: string
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true

    AuctionSlotUpdate:
      type: object
      description: Полное обновление слота (PUT). Все поля обязательны.
      required:
        - title
        - startPrice
        - status
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          nullable: true
        startPrice:
          type: number
          format: double
          minimum: 0
        seller:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AuctionSlotStatus'
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Человекочитаемое описание ошибки
          example: Слот не найден
        details:
          type: object
          additionalProperties: true
          description: Дополнительная информация об ошибке

  responses:
    BadRequest:
      description: Некорректный запрос или невалидные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт состояния (например, слот уже продан)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'